<!DOCTYPE html>
<html>
<head>
    <title>Running Emoji</title>
    <style>
        body {
            margin: 0;
            padding: 50px;
            background: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .emoji {
            font-size: 200px;
            margin: 50px 0;
        }
        .instructions {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="emoji">🏃‍♂️</div>
    
    <div class="instructions">
        <h3>How to capture this emoji:</h3>
        <p><strong>Method 1:</strong> Use Windows Snipping Tool (Windows + Shift + S)</p>
        <p><strong>Method 2:</strong> Take a screenshot (PrtScn) and crop</p>
        <p><strong>Method 3:</strong> Right-click → "Inspect" → find the emoji element → right-click → "Copy image"</p>
        <p>Then go to <a href="https://favicon.io/favicon-converter/" target="_blank">favicon.io</a> to convert to favicon</p>
    </div>
</body>
</html>
